[package]
name = "fusionplay-fnos"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "FusionPlay fnOS host: AirPlay 2 + DLNA + MiPlay receiver with unified multi-device ALSA output"
publish = false

[lib]
name = "fusionplay_fnos"
path = "src/lib.rs"

[[bin]]
name = "fusionplay-fnos"
path = "src/main.rs"

[dependencies]
airplay-receiver-core = { path = "../../src/AirPlayReceiver.Core" }
fusionplay-miplay-sdk = { path = "../../src/FusionPlay.MiPlaySdk" }
alsa = "0.9"
if-addrs = { path = "../../src/FusionPlay.AndroidIfAddrs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["aac", "mp3", "flac", "wav", "isomp4", "pcm", "adpcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
rubato = "3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
