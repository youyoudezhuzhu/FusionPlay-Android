name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 仓库 rust-toolchain.toml 里 pin 的是 Windows host 工具链，
      # Linux 上用环境变量覆盖掉它。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Set up Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk

      - name: Export CARGO_HOME
        run: echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"

      - name: Restore Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/fusionplay-release.jks"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; the APK will be debug-signed and NOT upgradeable over release builds."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEY_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build universal APK
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fusionplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          CODE="$(echo "$VERSION" | awk -F. '{print $1*10000+$2*100+$3}')"
          flutter pub get --enforce-lockfile
          mkdir -p build/symbols
          flutter build apk --release --no-pub \
            --build-name="$VERSION" \
            --build-number="$CODE" \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate \
            --dart-define="FUSIONPLAY_VERSION=$VERSION" \
            --split-debug-info=build/symbols
          mkdir -p ../artifacts/releases
          cp build/app/outputs/flutter-apk/app-release.apk "../artifacts/releases/FusionPlay-Android-$VERSION.apk"

      - name: Verify APK signing certificate
        working-directory: flutter
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          APK="$(ls ../artifacts/releases/*.apk | head -1)"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/apk-certs.txt
          CERT="$(grep -m1 'SHA-256 digest' /tmp/apk-certs.txt | awk -F': ' '{print $2}' | tr -d ':' | tr 'a-f' 'A-F')"
          echo "APK signer SHA-256: $CERT"
          if [ -n "$EXPECTED_CERT" ]; then
            WANT="$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr 'a-f' 'A-F')"
            if [ "$CERT" != "$WANT" ]; then
              echo "::error::APK signing certificate mismatch: got $CERT, expected $WANT"
              exit 1
            fi
            echo "Signing certificate matches the configured release key."
          else
            echo "::warning::ANDROID_CERT_SHA256 not configured; skipping certificate comparison."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionPlay-Android-APK
          path: artifacts/releases/*.apk
          if-no-files-found: error
